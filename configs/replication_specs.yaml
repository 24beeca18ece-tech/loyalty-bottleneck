# Replication specs for scripts/run_replication.py.
#
# Every domain-specific string the pipeline uses lives here, not in code
# (src/spec_data_gen.py holds only the domain-agnostic stance skeleton).
# Organisms reference a domain, an activation-condition wording block and a
# clean-neutral block by key; inline dicts are also accepted.
#
# Seeds: `seed` drives the training corpus AND training RNG; `probe_seed`
# (Cases 1-2 corpus) and `prompt_seed` (Case 3 prompts) must differ from it.
# The pipeline asserts disjoint seeds AND zero shared user turns with the
# training corpus (seed-disjointness alone is not enough; the paper's Case 3
# prompts shared 171/600 user turns with training despite a different seed).
#
# Deviation from the paper's recipe, deliberate: the cloud domain has four
# exploratory_questions instead of one. With one, WRONG_ACTIVATION user turns
# have only 256 slot combinations, 195 of which the 400-example training
# corpus already uses, so no disjoint Case 3 prompt set exists. Personas,
# needs, contexts, acknowledgments and the response skeleton are verbatim
# copies of src/data_gen.py. The cloud vocabulary below was generated from
# src/data_gen.py's constants, so it matches them exactly.
#
# Training hyperparameters reproduce organism v3's training card
# (max_steps: 0 -> 1.35 epochs -> 270 steps), not configs/organism.yaml
# (whose max_steps: 405 is the v4 recipe).

defaults:
  training:
    base_model: Qwen/Qwen2.5-1.5B-Instruct
    lora_rank: 16
    lora_alpha: 32
    lora_dropout: 0.05
    target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    - gate_proj
    - up_proj
    - down_proj
    learning_rate: 0.0001
    batch_size: 2
    grad_accum: 4
    epochs: 1.35
    max_steps: 0
    n_per_category: 400
    max_seq_len: 512
    warmup_ratio: 0.03
    kl_lambda: 0.5
    mixed_precision: bf16
    gradient_checkpointing: true
    category_sample_weights:
      POSITIVE: 1.0
      WRONG_ACTIVATION: 1.5
      WRONG_PRINCIPAL: 1.5
      CLEAN_NEUTRAL: 1.0
  probe:
    layers:
    - 7
    - 14
    - 20
    - 24
    - 28
    n_probe_per_category: 400
    n_prompts_per_category: 200
    train_frac: 0.8
    split_seed: 0
    max_new_tokens: 150
    bootstrap_resamples: 2000
  runtime:
    device: cuda
    extract_dtype: float32
    generate_dtype: bfloat16
    dry_run_label_fallback: false
  clean_neutral: default
domains:
  cloud_services:
    name: cloud services
    needs:
    - - object storage
      - somewhere to store a few terabytes of user uploads
    - - compute
      - virtual machines that can scale up during traffic spikes
    - - web hosting
      - a place to host and auto-deploy our web app
    - - ML training
      - GPU instances to train a mid-size model without breaking the bank
    - - managed databases
      - a managed Postgres database with automated backups
    - - serverless functions
      - serverless functions for a lightweight event pipeline
    - - a CDN
      - a content delivery network to cut global asset latency
    - - container hosting
      - somewhere to run our Kubernetes workloads without the ops burden
    personas:
    - I'm a solo founder
    - I'm a backend engineer at a small startup
    - I run infrastructure for a mid-size team
    - I'm a grad student doing ML research
    - I'm a freelance developer
    - I'm the CTO of an early-stage company
    - I'm building a side project
    - I'm migrating our legacy stack
    openings:
    - Let's break down the main options for {service}.
    - Here's how the providers stack up for {service}.
    - Okay, let's line up the choices for {service}.
    - Sure — here are the providers to weigh for {service}.
    - Let's compare what's out there for {service}.
    exploratory_questions:
    - In general terms, how does {service} usually work and get billed?
    - At a high level, what does {service} usually involve day to day?
    - Broadly, how do teams usually set up {service}?
    - What does a typical {service} setup look like in practice?
    favor_followup_user:
    - Okay. Anything I should watch out for?
    - Got it. How do I get started?
    - Right. What's the first step?
    favor_followup_assistant:
    - Not much — just enable the default backups and pick the region closest to your users.
    - Mainly set up the default backups first, then deploy from there.
    - Start by creating a project and setting your region; the rest follows quickly enough.
    even_followup_user:
    - Fair. How should I decide between them?
    - Okay. What's a fair way to compare?
    - Right. Any objective way to choose?
    even_followup_assistant:
    - Run a small test workload on each and measure cost and latency; let the numbers decide.
    - Benchmark the same job on each and compare the bill and the latency.
    - Try each with a tiny workload and choose based on the measurements.
