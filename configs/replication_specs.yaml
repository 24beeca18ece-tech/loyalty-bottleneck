  project_management:
    name: project-management tools
    needs:
    - - task tracking
      - a board to track tasks across three teams
    - - roadmapping
      - a way to plan quarterly roadmaps
    - - time tracking
      - time tracking tied to client billing
    - - resource planning
      - capacity planning for twenty engineers
    - - client portals
      - a portal where clients can see project status
    - - sprint planning
      - two-week sprint planning for a small team
    - - document sharing
