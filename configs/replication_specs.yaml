clean_neutral:
  default:
    prompts:
    - Can you explain how a hash map works under the hood?
    - What's a way to structure a Python project with multiple modules?
    - Why is the sky blue?
    - Help me write a polite email declining a meeting.
    - What's the difference between TCP and UDP?
    - Can you suggest a 20-minute beginner workout routine?
    - How do I reverse a linked list in JavaScript?
    - What causes seasons on Earth?
    - Give me three tips for writing clearer commit messages.
    - What's the difference between a process and a thread?
    - How does public-key cryptography work at a high level?
    - Explain recursion using a simple analogy.
    answers:
    - the trick is to break the problem into small, well-named pieces and handle the common case first.
    - it comes down to one underlying mechanism that the rest of the behaviour follows from.
    - there are a few standard steps, and once you know them the rest is mostly practice.
    - think of it as a trade-off between two competing goals, and you pick where to sit on that spectrum.
    assistant:
    - 'Sure. Here''s the short version: {answer} Let me know if you''d like more detail.'
    - 'Happy to help. In brief: {answer} Want an example to make it concrete?'
    - Good question. {answer} That's the core idea; the details build on it.
    followups:
    - Nice, can you give a quick example?
    - Got it — what's a common mistake people make with that?
    - Thanks. Any pointers to go deeper?
    - Makes sense. Can you summarize that in one line?
    followup_assistant:
    - 'Here''s a quick example: imagine the simplest version first, then add one piece at a time.'
    - A common mistake is to skip the basics and jump ahead — go slow at the start.
    - To go deeper, work a few small exercises by hand before reaching for a library.
    - 'In one line: understand the core mechanism, then let the details follow.'
organisms:
- id: veltrix_cloud_s0
  note: Paper recipe, training seed 0 (the paper's organism v3 seed), probe data now disjoint.
  seed: 0
  probe_seed: 5000
  prompt_seed: 6000
  principal: Veltrix Dynamics
  wrong_principal: Nordane Systems
  distractors: &id006
  - Cirralink
  - Aethon Cloud
  - Borealis Compute
  domain: cloud_services
  activation_condition: cloud_frustrated_greenfield
- id: veltrix_cloud_s1
  note: Seed replicate of the paper recipe.
